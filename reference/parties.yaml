# Cores e rótulos de blocos e partidos.
# Blocos pintam o mapa (~5 cores legíveis); partidos aparecem em listas/badges.

blocs:
  Lula:       { label: "Lula",             color: "#C4122E" }   # centro-esquerda (vermelho)
  Flávio:     { label: "Flávio Bolsonaro", color: "#1B3A8C" }   # direita (azul)
  Caiado:     { label: "Caiado",           color: "#1E8449" }   # centro-direita (verde)
  Zema:       { label: "Zema",             color: "#E67E22" }   # Novo/liberal (laranja)
  Indefinido: { label: "Indefinido",       color: "#94A3B8" }   # cinza

