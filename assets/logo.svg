<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Eleições 2026 — urna com voto confirmado">
  <!-- corpo da urna -->
  <rect x="132" y="140" width="248" height="268" rx="26" fill="#f1f5f9"/>
  <rect x="132" y="140" width="248" height="268" rx="26" fill="none" stroke="#0f766e" stroke-width="6" opacity="0.25"/>
  <!-- tela -->
  <rect x="164" y="172" width="184" height="132" rx="14" fill="#0f766e"/>
  <!-- voto confirmado (check) -->
  <path d="M204 240 l30 32 l58 -66" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- teclado -->
  <g fill="#0f172a">
    <rect x="176" y="330" width="40" height="30" rx="7"/>
    <rect x="236" y="330" width="40" height="30" rx="7"/>
    <rect x="296" y="330" width="40" height="30" rx="7"/>
    <rect x="176" y="368" width="40" height="30" rx="7"/>
    <rect x="236" y="368" width="40" height="30" rx="7"/>
  </g>
  <!-- tecla confirma -->
  <rect x="296" y="368" width="40" height="30" rx="7" fill="#1E8449"/>
</svg>
