# Casos DOCUMENTADOS de erro/acerto de pesquisa ao Senado (2018/2022), para sanity-check.
# Números são as posições da pesquisa final + resultado real, aproximados das fontes citadas
# na pesquisa de embasamento (ND Mais, Gazeta/Ibope, Senado Notícias, CNN, Metrópoles).
# ATENÇÃO: amostra pequena e ENVIESADA para casos notórios — serve para mostrar a DIREÇÃO
# (a chapa recupera erros da pesquisa; o teto do Senado não deve ser 1,0), não para cravar o teto.
# pres/gov = % do bloco no estado (2º turno presidencial / resultado do governador).
# blocos: Dir (Bolsonaro/direita) x Esq (PT/esquerda). seats = vagas em disputa naquele ano.

races:
  - id: MG-2018
    seats: 2
    pres: {Dir: 55, Esq: 45}
    gov:  {Dir: 72, Esq: 28}       # Zema (Novo) venceu
    winners: [Rodrigo Pacheco, Carlos Viana]
    senate:
      - {name: Dilma Rousseff, party: PT,   bloc: Esq, poll_pct: 28, endorsement: inferido}
      - {name: Rodrigo Pacheco, party: DEM,  bloc: Dir, poll_pct: 17, endorsement: chapa/aliança}
      - {name: Carlos Viana,    party: PHS,  bloc: Dir, poll_pct: 14, endorsement: chapa/aliança}
      - {name: Antonio Anastasia, party: PSDB, bloc: Dir, poll_pct: 12, endorsement: inferido}

