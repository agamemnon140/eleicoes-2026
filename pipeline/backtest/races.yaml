# Casos DOCUMENTADOS de erro/acerto de pesquisa ao Senado (2018/2022), para sanity-check.
# Números = posição da pesquisa final + resultado real, aproximados das fontes citadas na
# pesquisa de embasamento (ND Mais, Gazeta/Ibope, Senado Notícias, CNN, Metrópoles).
# `mom` = momentum ≈ variação (p.p.) da pesquisa nas ~3-4 semanas finais (últimas pesquisas
# menos as de ~1 mês antes), refletindo a dinâmica documentada (colapsos e surtos tardios).
# ATENÇÃO: amostra pequena e ENVIESADA para casos notórios de virada tardia — serve para
# TESTAR A DIREÇÃO (momentum ajuda a pegar viradas de última hora?), não para cravar pesos.
# pres/gov = % do bloco no estado. blocos: Dir (Bolsonaro) x Esq (PT). seats = vagas no ano.

